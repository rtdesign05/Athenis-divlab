services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: athenis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: athenis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athenis -d athenis_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - athenis

  backend:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://athenis:${POSTGRES_PASSWORD:-password}@postgres:5432/athenis_db
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - athenis

  frontend:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.frontend
      args:
        # Variables Vite — injectées au moment du `npm run build` côté Dockerfile.
        # Récupérées du fichier .env grâce à --env-file (cf scripts/deploy).
        VITE_API_URL:      ${VITE_API_URL:-https://athenis360.com/api}
        VITE_SENTRY_DSN:   ${VITE_SENTRY_DSN:-}
        VITE_POSTHOG_KEY:  ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://eu.i.posthog.com}
    restart: unless-stopped
    networks:
      - athenis

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
      - ./downloads:/var/www/downloads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - athenis

  # ── Certbot — renouvellement automatique Let's Encrypt ─────────────────────
  # Initialisation : ./scripts/ssl-init.sh <domaine> <email>
  # Ce service ne tourne qu'en prod (profil "production")
  certbot:
    image: certbot/certbot:latest
    profiles: ["production"]
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
      - ./nginx/certs:/certs
    # Renouvelle toutes les 12 h (Let's Encrypt expire tous les 90 jours)
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --quiet --webroot --webroot-path=/var/www/certbot;
        sleep 12h & wait $${!};
      done"
    networks:
      - athenis

volumes:
  postgres_data:
  certbot_webroot:
  certbot_certs:

networks:
  athenis:
    driver: bridge
