name: Deploy to Production

# Deploy au VPS athenis360.com :
#   • Automatique : après chaque push sur main (CI verte).
#   • Manuel    : via "Run workflow" depuis l'onglet Actions, en choisissant
#     la branche à déployer (dev, main, ou n'importe quelle autre). Utile
#     pour pousser un fix urgent depuis dev sans passer par main.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branche à déployer (ex: dev, main)'
        required: true
        default: 'main'
        type: string

# Empêche 2 deploys en parallèle (race condition migrate, container restart, etc.).
# cancel-in-progress=false → si un deploy est en cours, on attend la fin avant de lancer le suivant.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Auto-deploy : seulement si la CI a réussi. Manual : toujours autorisé.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Resolve target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            BRANCH="main"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "▶ Branche cible : $BRANCH"

      - name: Checkout (informatif — la prod pull depuis git)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BRANCH:   ${{ steps.target.outputs.branch }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "BRANCH='$BRANCH' bash -euo pipefail << 'REMOTE_EOF'
            cd /home/ubuntu/athenis

            echo '═══════════════════════════════════════════════════════'
            echo \"▶ Pull du code depuis \$BRANCH\"
            echo '═══════════════════════════════════════════════════════'
            git fetch origin \"\$BRANCH\"
            git checkout \"\$BRANCH\"
            git reset --hard \"origin/\$BRANCH\"

            COMMIT_SHA=\$(git rev-parse --short HEAD)
            COMMIT_MSG=\$(git log -1 --pretty=%s)
            echo \"Commit déployé : \$COMMIT_SHA — \$COMMIT_MSG\"

            cd infra

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Build des images backend + frontend'
            echo '═══════════════════════════════════════════════════════'
            docker compose --env-file ../.env build backend frontend

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Recreate des containers (force-recreate pour récup la nouvelle image)'
            echo '═══════════════════════════════════════════════════════'
            docker compose --env-file ../.env up -d --force-recreate backend frontend

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Attente health postgres + backend'
            echo '═══════════════════════════════════════════════════════'
            sleep 6

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Application des migrations Prisma (idempotent)'
            echo '═══════════════════════════════════════════════════════'
            docker exec -w /app/apps/backend infra-backend-1 npx prisma migrate deploy

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Restart nginx (clear DNS cache après recreate)'
            echo '═══════════════════════════════════════════════════════'
            docker compose restart nginx

            sleep 2
            echo '═══════════════════════════════════════════════════════'
            echo '▶ État final des containers'
            echo '═══════════════════════════════════════════════════════'
            docker compose ps
          REMOTE_EOF"

      - name: Smoke tests
        run: |
          set -e
          echo '─── Frontend HTTPS ───'
          curl -fsS -o /dev/null -w 'HTTP %{http_code} (%{time_total}s)\n' https://athenis360.com/

          echo '─── API health ───'
          curl -fsS https://athenis360.com/api/health

          echo ''
          echo '─── Page register ───'
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' https://athenis360.com/auth/register

          echo '✓ Tous les smoke tests passent'

      - name: Notify on failure
        if: failure()
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo '⚠ Déploiement échoué. Backend logs des 30 dernières lignes :'
          ssh "$VPS_USER@$VPS_HOST" 'docker logs infra-backend-1 --tail 30' || true
          echo ''
          echo 'État Docker :'
          ssh "$VPS_USER@$VPS_HOST" 'cd /home/ubuntu/athenis/infra && docker compose ps' || true
          exit 1
