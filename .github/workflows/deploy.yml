name: Deploy to Production

# Auto-deploy sur le VPS athenis360.com après chaque push sur main.
# Précondition : CI verte (typecheck, lint, tests, build) — sinon ce workflow
# ne tourne pas (concurrency + condition success de CI ci-dessous).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Empêche 2 deploys en parallèle (race condition migrate, container restart, etc.).
# cancel-in-progress=false → si un deploy est en cours, on attend la fin avant de lancer le suivant.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Seulement si la CI a réussi
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout (informatif — la prod pull depuis git)
        uses: actions/checkout@v4
        with:
          # On checkout juste pour afficher le SHA dans les logs, le vrai pull se fait sur le VPS
          ref: main

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "bash -euo pipefail << 'REMOTE_EOF'
            cd /home/ubuntu/athenis

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Pull du code depuis main'
            echo '═══════════════════════════════════════════════════════'
            git pull --ff-only origin main

            COMMIT_SHA=\$(git rev-parse --short HEAD)
            COMMIT_MSG=\$(git log -1 --pretty=%s)
            echo \"Commit déployé : \$COMMIT_SHA — \$COMMIT_MSG\"

            cd infra

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Build des images backend + frontend'
            echo '═══════════════════════════════════════════════════════'
            docker compose --env-file ../.env build backend frontend

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Recreate des containers (force-recreate pour récup la nouvelle image)'
            echo '═══════════════════════════════════════════════════════'
            docker compose --env-file ../.env up -d --force-recreate backend frontend

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Attente health postgres + backend'
            echo '═══════════════════════════════════════════════════════'
            sleep 6

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Application des migrations Prisma (idempotent)'
            echo '═══════════════════════════════════════════════════════'
            docker exec -w /app/apps/backend infra-backend-1 npx prisma migrate deploy

            echo '═══════════════════════════════════════════════════════'
            echo '▶ Restart nginx (clear DNS cache après recreate)'
            echo '═══════════════════════════════════════════════════════'
            docker compose restart nginx

            sleep 2
            echo '═══════════════════════════════════════════════════════'
            echo '▶ État final des containers'
            echo '═══════════════════════════════════════════════════════'
            docker compose ps
          REMOTE_EOF"

      - name: Smoke tests
        run: |
          set -e
          echo '─── Frontend HTTPS ───'
          curl -fsS -o /dev/null -w 'HTTP %{http_code} (%{time_total}s)\n' https://athenis360.com/

          echo '─── API health ───'
          curl -fsS https://athenis360.com/api/health

          echo ''
          echo '─── Page register ───'
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' https://athenis360.com/auth/register

          echo '✓ Tous les smoke tests passent'

      - name: Notify on failure
        if: failure()
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo '⚠ Déploiement échoué. Backend logs des 30 dernières lignes :'
          ssh "$VPS_USER@$VPS_HOST" 'docker logs infra-backend-1 --tail 30' || true
          echo ''
          echo 'État Docker :'
          ssh "$VPS_USER@$VPS_HOST" 'cd /home/ubuntu/athenis/infra && docker compose ps' || true
          exit 1
