name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Typecheck backend ────────────────────────────────────────────────────────
  typecheck-backend:
    name: TypeCheck Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Aligne npm sur la version qui a généré package-lock.json (11.x).
      # npm 10 (livré avec Node 20) lit mal certains lockfile versionVersion=3
      # générés par npm 11 → "Missing: X from lock file" sur les peer deps.
      - name: Upgrade npm to 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build -w packages/shared-types

      - name: Generate Prisma client
        working-directory: apps/backend
        run: |
          npx prisma generate
          echo "--- Verifying generated client ---"
          test -f ../../node_modules/.prisma/client/index.d.ts && echo "OK: .prisma/client/index.d.ts exists" || (echo "MISSING: .prisma/client/index.d.ts" && exit 1)
          grep -c "AccountingZone" ../../node_modules/.prisma/client/index.d.ts || (echo "MISSING enum AccountingZone in generated client" && exit 1)

      - name: TypeScript check (backend)
        run: npm run typecheck -w apps/backend

      - name: Unit tests (backend)
        run: npm test -w apps/backend
        env:
          # Les tests unitaires ne touchent pas la DB (mocks Prisma), mais
          # src/config/env.ts charge ces vars au module-load des helpers
          # qui importent indirectement logger.ts → env.ts.
          DATABASE_URL:       postgresql://test:test@localhost:5432/test
          JWT_SECRET:         test-jwt-secret-ci-only
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-ci-only
          ENCRYPTION_KEY:     0123456789abcdef0123456789abcdef

  # ── Lint frontend ────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Upgrade npm to 11
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint -w apps/frontend
        continue-on-error: true  # non-bloquant tant que la dette n'est pas résorbée

  # ── Typecheck frontend ───────────────────────────────────────────────────────
  typecheck-frontend:
    name: TypeCheck Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Aligne npm sur la version qui a généré package-lock.json (11.x).
      # npm 10 (livré avec Node 20) lit mal certains lockfile versionVersion=3
      # générés par npm 11 → "Missing: X from lock file" sur les peer deps.
      - name: Upgrade npm to 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        run: npm run typecheck -w apps/frontend

  # ── Build backend ────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: typecheck-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Aligne npm sur la version qui a généré package-lock.json (11.x).
      # npm 10 (livré avec Node 20) lit mal certains lockfile versionVersion=3
      # générés par npm 11 → "Missing: X from lock file" sur les peer deps.
      - name: Upgrade npm to 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build -w packages/shared-types

      - name: Generate Prisma client
        working-directory: apps/backend
        run: |
          npx prisma generate
          echo "--- Verifying generated client ---"
          test -f ../../node_modules/.prisma/client/index.d.ts && echo "OK: .prisma/client/index.d.ts exists" || (echo "MISSING: .prisma/client/index.d.ts" && exit 1)
          grep -c "AccountingZone" ../../node_modules/.prisma/client/index.d.ts || (echo "MISSING enum AccountingZone in generated client" && exit 1)

      - name: Build backend
        run: npm run build -w apps/backend

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
          retention-days: 7

  # ── Build frontend ───────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: typecheck-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Aligne npm sur la version qui a généré package-lock.json (11.x).
      # npm 10 (livré avec Node 20) lit mal certains lockfile versionVersion=3
      # générés par npm 11 → "Missing: X from lock file" sur les peer deps.
      - name: Upgrade npm to 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build -w packages/shared-types

      - name: Build frontend
        run: npm run build -w apps/frontend
        env:
          VITE_API_URL: /api

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 7

  # ── Docker build (only on push to main) ─────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/dockerfiles/Dockerfile.backend
          push: false
          tags: athenis/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/dockerfiles/Dockerfile.frontend
          push: false
          tags: athenis/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
