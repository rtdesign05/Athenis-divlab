[package]
name = "athenis"
version = "1.0.0"
description = "Athenis — Gestion financière 360"
authors = ["Athenis"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "athenis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "athenis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
