  <text x="612" y="370" font-family="Arial" font-size="10" fill="#0f172a">FA-2026-039</text>
  <text x="612" y="384" font-family="Arial" font-size="9" fill="#94a3b8">SABC Douala</text>
  <rect x="748" y="358" width="56" height="18" rx="9" fill="#dcfce7"/>
  <text x="776" y="371" font-family="Arial" font-size="9" fill="#16a34a" text-anchor="middle">Payée</text>

